name: CD - Build & Release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK (release)
      run: flutter build apk --release --no-pub
    
    - name: Build AAB (release)
      run: flutter build appbundle --release --no-pub
    
    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: fuel-expense-tracker-release.apk
        path: build/app/outputs/flutter-apk/app-release.apk
    
    - name: Upload AAB to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: fuel-expense-tracker-release.aab
        path: build/app/outputs/bundle/release/app-release.aab
    
    - name: Create Release with APK
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build Windows app
      run: flutter build windows --release --no-pub
    
    - name: Upload Windows build
      uses: actions/upload-artifact@v3
      with:
        name: fuel-expense-tracker-windows
        path: build/windows/x64/runner/Release/

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Analyze code
      run: flutter analyze --no-pub || true
    
    - name: Check for security vulnerabilities
      run: dart pub global activate dartdoc && flutter pub get || true
